name: Deploy site

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Bewust `false`: dit is een echte productie-deploy die met `rsync` bestanden
  # overzet. Twee snelle pushes achter elkaar braken met `true` de eerste run
  # middenin de overdracht af — resultaat: een half gedeployde site. Deploys
  # horen op elkaar te wachten, niet elkaar te annuleren.
  group: deploy-site
  cancel-in-progress: false

jobs:
  # Deploy-gate: live.yml is een echte productie-deploy (deploy-site.yml rsync't
  # dist/ naar open-planner-studio.open-aec.com) en draaide tot nu toe parallel
  # aan ci.yml, zónder op diens poorten te wachten — een rode suite kon daardoor
  # gewoon live staan. Deze gate draait de stappen van `npm run verify`, precies
  # wat ci.yml ook draait, vóór de deploy. (Geen versievergelijking hier: dat hoort
  # bij een release, niet bij een site-deploy.)
  #
  # Verdeeld over parallelle delen via `scripts/verify-parts.mjs`, zoals in ci.yml.
  # Eén job met `npm run verify` kostte 31–43 min en raakte op 2026-10-13 de grens van
  # 45 min (run 38422479396: alle stappen groen, afgebroken 3 s vóór het einde; de
  # deploy sloeg over). De som blijft groeien met elke nieuwe browsertest; met delen is
  # de langste job de maat (browsershard, ~10 min) in plaats van de som.
  gate:
    name: gate (${{ matrix.name }})
    # Bevinding O6. De `deploy`-job hieronder krijgt er bewust géén: op een job
    # met `uses:` (reusable workflow) is `timeout-minutes` niet toegestaan.
    # 45 zoals de verify-jobs in ci.yml (#229).
    timeout-minutes: 45
    permissions:
      contents: read
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Dezelfde delen als ci.yml; de `static`-job controleert hieronder dat deze matrix er
      # geen vergeet (een nieuwe `verify`-stap valt vanzelf in `static`).
      matrix:
        include:
          - part: static
            name: static
          - part: planning
            name: planning
          - part: suites
            name: suites
          - part: browser
            name: browser 1-4
            shard: 1/4
          - part: browser
            name: browser 2-4
            shard: 2/4
          - part: browser
            name: browser 3-4
            shard: 3/4
          - part: browser
            name: browser 4-4
            shard: 4/4

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies (npm ci)
        run: npm ci

      - name: Install Playwright Chromium
        if: matrix.part == 'browser'
        run: npx playwright install --with-deps --only-shell chromium

      - name: Check that this matrix runs every verify part
        if: matrix.part == 'static'
        run: node scripts/verify-parts.mjs --check-ci .github/workflows/live.yml

      # Dezelfde stappen als ci.yml en release.yml — één definitie, in package.json:
      # typecheck (src én scripts/tests) + de vijf testsuites + verify:examples +
      # verify:docs + de AST-poorten.
      - name: Verify (${{ matrix.name }})
        run: node scripts/verify-parts.mjs ${{ matrix.part }} ${{ matrix.shard && format('-- --shard={0}', matrix.shard) || '' }}

      - name: Upload Playwright failure artifacts
        if: failure() && matrix.part == 'browser'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-live-${{ strategy.job-index }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  deploy:
    needs: gate
    # Op SHA gepind in plaats van `@main`. Deze reusable workflow krijgt
    # `DEPLOY_SSH_KEY` doorgegeven: op `@main` kon iedereen met schrijfrechten op
    # OpenAEC-Foundation/github bij de volgende main-push van DEZE repo de
    # deploysleutel exfiltreren, zonder dat hier iets wijzigde. De repo heeft
    # geen tags, dus een SHA is de enige onveranderlijke ref.
    # Bijwerken = deze SHA bewust verhogen (upstream-wijzigingen komen niet meer
    # vanzelf binnen); 33fa7d9 = "Update deployment actions to Node.js 24".
    uses: OpenAEC-Foundation/github/.github/workflows/deploy-site.yml@33fa7d9469a6632154d97210acbb637278738a04
    with:
      deploy_host: ${{ vars.DEPLOY_HOST }}
      deploy_port: ${{ vars.DEPLOY_PORT }}
      deploy_user: ${{ vars.DEPLOY_USER }}
      deploy_path: /var/www/open-planner-studio.open-aec.com
      node_version: "22"
      install_command: npm ci
      build_command: npm run build
      deploy_source: dist
    secrets:
      deploy_ssh_key: ${{ secrets.DEPLOY_SSH_KEY }}
